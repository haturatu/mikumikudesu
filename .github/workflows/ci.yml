name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - docs/**
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - docs/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  SDL3_PREFIX: ${{ github.workspace }}/.ci-deps/sdl3

jobs:
  build:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
            preset: linux-debug
            upstream: true
          - compiler: Clang
            cc: clang
            cxx: clang++
            preset: linux-debug
            upstream: false
          - compiler: GCC
            cc: gcc
            cxx: g++
            preset: linux-release
            upstream: false
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Restore APT package cache
        uses: ./.github/actions/cache-apt
        with:
          scope: build

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get \
            -o Dir::Cache::archives="$RUNNER_TEMP/mikumikudesu-apt/" \
            -o APT::Keep-Downloaded-Packages=true \
            install --no-install-recommends -y \
            ccache \
            ffmpeg \
            glslc \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libbullet-dev \
            libjsonnet-dev \
            libstb-dev \
            libasound2-dev \
            libswresample-dev \
            libswscale-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            ninja-build \
            vulkan-validationlayers \
            xvfb

      - name: Restore or build SDL3
        uses: ./.github/actions/setup-sdl3

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-v2-${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.preset }}-

      - name: Restore MikuMikuDayo archive
        if: matrix.upstream
        uses: actions/cache@v6
        with:
          path: .cache/mikumikudayo
          key: mikumikudayo-${{ hashFiles('deps/mikumikudayo.lock') }}

      - name: Prepare MikuMikuDayo
        if: matrix.upstream
        run: python3 scripts/fetch-mikumikudayo.py

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}" -DCMAKE_PREFIX_PATH="$SDL3_PREFIX" -DDAYO_WARNINGS_AS_ERRORS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel

      - name: Test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LD_LIBRARY_PATH: ${{ github.workspace }}/.ci-deps/sdl3/lib
        run: xvfb-run -a -s '-screen 0 1280x1024x24' ctest --preset "${{ matrix.preset }}" --output-on-failure --parallel "$(nproc)" -LE upstream

      - name: Test upstream compatibility
        if: matrix.upstream
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LD_LIBRARY_PATH: ${{ github.workspace }}/.ci-deps/sdl3/lib
        run: xvfb-run -a -s '-screen 0 1280x1024x24' ctest --preset "${{ matrix.preset }}" --output-on-failure --parallel "$(nproc)" -L upstream

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

  system-dependencies-only:
    name: GCC / linux-system-only
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Restore APT package cache
        uses: ./.github/actions/cache-apt
        with:
          scope: system-only

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get \
            -o Dir::Cache::archives="$RUNNER_TEMP/mikumikudesu-apt/" \
            -o APT::Keep-Downloaded-Packages=true \
            install --no-install-recommends -y \
            ffmpeg \
            glslc \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libbullet-dev \
            libjsonnet-dev \
            libstb-dev \
            libswresample-dev \
            libswscale-dev \
            libasound2-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            ninja-build \
            nlohmann-json3-dev \
            vulkan-validationlayers \
            xvfb

      - name: Restore or build SDL3
        uses: ./.github/actions/setup-sdl3

      - name: Configure without FetchContent dependencies
        env:
          CC: gcc
          CXX: g++
        run: cmake --preset linux-system-only -DCMAKE_PREFIX_PATH="$SDL3_PREFIX" -DDAYO_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset linux-system-only --parallel

      - name: Test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LD_LIBRARY_PATH: ${{ github.workspace }}/.ci-deps/sdl3/lib
        run: xvfb-run -a -s '-screen 0 1280x1024x24' ctest --preset linux-system-only --output-on-failure --parallel "$(nproc)" -LE upstream
