name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  changes:
    name: Detect C/C++ changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          base: ${{ github.ref }}
          filters: |
            cpp:
              - 'src/**'
              - 'tests/**'
              - 'external/**'
              - 'cmake/**'
              - 'scripts/**'
              - 'shaders/**'
              - 'deps/**'
              - 'third_party/**'
              - 'tools/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - '.gitmodules'
              - 'vcpkg.json'
              - '.github/workflows/codeql.yml'
  analyze:
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.cpp == 'true'
    name: Analyze C/C++
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          build-mode: none
          queries: security-and-quality

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:cpp
          # Private repositories without Code Scanning enabled reject SARIF uploads.
          upload: false
