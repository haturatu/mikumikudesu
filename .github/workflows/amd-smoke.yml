name: AMD Linux smoke test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - docs/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: RADV / Vulkan / renderer smoke
    runs-on: [self-hosted, linux, amd, vulkan]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore MikuMikuDayo archive
        uses: actions/cache@v6
        with:
          path: .cache/mikumikudayo
          key: mikumikudayo-${{ hashFiles('deps/mikumikudayo.lock') }}

      - name: Run AMD smoke test
        run: ./scripts/check-linux-amd.sh
